{% extends "base.html" %}
{% block title %}Password help{% endblock %}
{% block content %}
<div class="panel narrow"><h1>Password help</h1>
<p class="muted">Submit your registered email. A reset request will be recorded for the transport administrator. No reset email is sent unless an email service is configured.</p>
<form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Registered email</label><input type="email" name="email" required>
<button class="btn btn-primary" type="submit">Submit request</button></form></div>
{% endblock %}
