{% extends "base.html" %}
{% block title %}Emergency alerts{% endblock %}
{% block content %}
{% include "_admin_nav.html" %}
<section class="panel narrow-wide"><h1>Publish emergency alert</h1>
<form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Alert title</label><input name="title" required placeholder="Bus breakdown / route closure">
<label>Message</label><textarea name="message" rows="4" required></textarea>
<label>Target route (optional; blank sends to all students)</label><select name="route_code"><option value="">All students</option>{% for r in routes %}<option value="{{ r.route_code }}">{{ r.route_code }} · {{ r.name }}</option>{% endfor %}</select>
<button class="btn btn-primary" type="submit">Publish alert</button></form></section>
{% endblock %}
